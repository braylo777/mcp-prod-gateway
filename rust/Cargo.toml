[package]
name = "mcpgw"
version = "0.1.0"
edition = "2021"
description = "Rust port (PyCrust) of mcp-prod-gateway: OAuth 2.1, version shims, allowlist and supply-chain scanner for MCP servers"
license = "MIT"

[dependencies]
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
indexmap = "2"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
